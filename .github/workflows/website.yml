name: Product website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/build-site.cjs', 'docs/**', 'frontend/public/**', 'vercel.json', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'scripts/build-site.cjs', 'docs/**', 'frontend/public/**', 'vercel.json', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-site.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        with:
          name: traqu-website
          path: website/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
        with:
          path: website/dist
  pages:
    needs: website
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
