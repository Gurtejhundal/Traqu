name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/desktop-app']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-22.04, arch: x64 }
          - { name: Windows x64, os: windows-latest, arch: x64 }
          - { name: macOS Apple Silicon, os: macos-15, arch: arm64 }
          - { name: macOS Intel, os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgtk-3-0 libnss3 libasound2 xvfb
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm test --prefix frontend
      - run: npm run lint --prefix frontend
      - name: Backend tests
        shell: bash
        working-directory: backend
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ../.venv-desktop/Scripts/python.exe -m pytest -q
          else
            ../.venv-desktop/bin/python -m pytest -q
          fi
      - run: npm run build
      - name: Desktop end-to-end test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
        env:
          TRAQO_TEST_NO_SANDBOX: '1'
      - name: Desktop end-to-end test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Package installer
        run: npx electron-builder --${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'mac' || 'linux' }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
        env:
          TRAQO_TEST_NO_SANDBOX: '1'
          TRAQO_TEST_EXECUTABLE: '${{ github.workspace }}/release/linux-unpacked/traqo-desktop'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Traqo-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ runner.os }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
