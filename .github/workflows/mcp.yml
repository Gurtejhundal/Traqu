name: Local MCP server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', 'mcp_tests/**', 'scripts/*mcp.cjs', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['backend/**', 'mcp_tests/**', 'scripts/*mcp.cjs', '.github/workflows/mcp.yml']

permissions:
  contents: read

jobs:
  stdio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: node scripts/setup-mcp.cjs
        env:
          TRAQU_MCP_PYTHON: python
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv-mcp/Scripts/python.exe -m unittest discover -s mcp_tests -v
          else
            .venv-mcp/bin/python -m unittest discover -s mcp_tests -v
          fi
