<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Traqu README artwork source</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="art"></canvas>
<script>
// Deterministic vector illustrations. App screenshots live in ../screenshots/.
const canvas = document.querySelector('canvas');
const c = canvas.getContext('2d');
const ink = '#191919', muted = '#787774', border = '#e9e9e7', paper = '#f7f7f5', green = '#287a49';
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => { const x = clamp(v); return x * x * (3 - 2 * x); };
function box(x,y,w,h,r=8,fill='#fff',stroke=border) {
  c.beginPath(); c.roundRect(x,y,w,h,r);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=1; c.stroke(); }
}
function line(x1,y1,x2,y2,color=border,width=1) {
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.strokeStyle=color; c.lineWidth=width; c.lineCap='round'; c.stroke();
}
function text(value,x,y,size=16,weight=400,color=ink,align='left',font='Arial') {
  c.font=`${weight} ${size}px ${font}, sans-serif`; c.fillStyle=color; c.textAlign=align; c.fillText(value,x,y);
}
function dot(x,y,r,color=green) { c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fillStyle=color; c.fill(); }
function logo(x,y,size) {
  c.save(); c.translate(x,y); c.scale(size/64,size/64);
  box(4,4,56,56,12,'#fff',null); c.strokeStyle=ink; c.lineWidth=4; c.stroke();
  line(17,20,47,20,ink,5); line(32,20,32,44,ink,5); dot(46,45,4,ink); c.restore();
}
function checkbox(x,y,amount,size=18) {
  box(x,y,size,size,3,amount > 0 ? ink : '#fff',amount > 0 ? ink : '#d3d3d1');
  if(amount > 0){
    c.save(); c.beginPath(); c.rect(x,y,size*clamp(amount),size); c.clip();
    line(x+4,y+9,x+7,y+12,'#fff',1.6); line(x+7,y+12,x+14,y+5,'#fff',1.6); c.restore();
  }
}
function tag(value,x,y,w) { box(x,y,w,30,5,paper,null); text(value,x+w/2,y+20,11,600,'#5f5e5b','center'); }
function setup(w,h) { canvas.width=w; canvas.height=h; c.fillStyle='#fff'; c.fillRect(0,0,w,h); }

function hero(t) {
  setup(1200,580);
  box(1,1,1198,578,18,paper,border);
  logo(48,40,40); text('Traqu',100,69,27,700);
  text('A QUIET PLACE FOR BIG PLANS',50,135,11,600,muted);
  dot(1019,58,3); text('LOCAL BY DESIGN',1031,62,10,600,muted);
  text('Big plans.',48,223,78,700);
  text('Small, steady wins.',48,291,53,700);
  text('Turn the roadmap you saved into',50,344,20,400,'#5f5e5b');
  text('the work you actually finish.',50,373,20,400,'#5f5e5b');
  tag('OFFLINE READY',50,419,110); tag('NO ACCOUNT',169,419,106); tag('YOUR COMPUTER',284,419,128);
  line(50,506,540,506,border);
  text('PLAN. FOCUS. FOLLOW THROUGH.',50,535,11,600,muted);

  const phase = t % 7;
  const completions=[ease((phase-0.6)/0.6),ease((phase-2.1)/0.6),ease((phase-3.7)/0.6),0];
  // A quiet return to the initial state keeps the loop gradual.
  const fade = 1-ease((phase-6.0)/0.9);
  const amounts=completions.map(v=>v*fade);
  const progress=amounts.reduce((a,b)=>a+b,0)/4;
  const y=143+Math.sin(t*Math.PI*2/7)*3;
  c.save(); c.shadowColor='rgba(25,25,25,.05)'; c.shadowBlur=28; c.shadowOffsetY=10;
  box(638,y,510,342,10,'#fff',border); c.restore();
  box(638,y,510,342,10,null,border);
  line(638,y+43,1148,y+43,border);
  logo(655,y+12,20); text('Document workspace',686,y+28,12,600,'#5f5e5b');
  dot(1119,y+23,3);
  text('WEEK 01 / THE FOUNDATIONS',665,y+78,10,600,muted);
  text('A little progress, every day.',665,y+112,23,700);
  const rows=['Read the first chapter','Practice the tricky parts','Build something small','Review what clicked'];
  rows.forEach((label,i)=>{
    const ry=y+141+i*37;
    checkbox(666,ry,amounts[i]);
    text(label,699,ry+14,14,400,amounts[i]>.9?muted:ink);
    if(amounts[i]>0){
      c.font='400 14px Arial'; const width=c.measureText(label).width;
      line(699,ry+9,699+width*amounts[i],ry+9,'#b8b8b2');
    }
  });
  text('ONE TASK CLOSER',666,y+314,9,600,muted);
  text(`${Math.round(progress*100)}%`,1120,y+314,11,600,ink,'right');
  box(802,y+305,258,3,1,paper,null);
  if(progress>.001) box(802,y+305,258*progress,3,1,ink,null);
  text('Your next chapter starts with one checkbox.',640,536,12,400,muted);
}

function flow(t) {
  setup(1200,300);
  const phase=t%7;
  const first=ease((phase-1)/.8)*(1-ease((phase-6)/.8));
  const second=ease((phase-3)/.8)*(1-ease((phase-6)/.8));
  [40,428,816].forEach(x=>box(x,15,344,267,9,paper,null));
  text('01 / BRING A PLAN',64,50,11,600,muted);
  text('# Your next chapter',64,99,17,600);
  text('— Learn the foundations',64,134,14,400,'#5f5e5b');
  text('— Make something real',64,162,14,400,'#5f5e5b');
  text('— Keep a little momentum',64,190,14,400,'#5f5e5b');
  text('PDF · DOCX · pasted text',64,249,12,400,muted);
  const scan=60+((Math.sin(t*Math.PI*2/7)+1)/2)*146;
  line(61,scan,363,scan,'#d3d3d1');
  text('02 / FIND YOUR FOCUS',452,50,11,600,muted);
  box(452,76,296,37,5,'#fff',border);
  text('Week 1 · Foundations',465,100,14,600);
  checkbox(454,139,first); text('One clear next step',483,153,14);
  checkbox(454,178,second); text('Keep the context',483,192,14);
  text('Sections, tasks, and your own notes.',452,249,12,400,muted);
  text('03 / KEEP THE PROGRESS',840,50,11,600,muted);
  const progress=(first+second)/4;
  text(`${Math.round(progress*100)}%`,840,143,62,700);
  text('a little further along.',840,177,15,400,'#5f5e5b');
  box(840,204,296,4,2,'#e3e3df',null);
  if(progress>.001)box(840,204,296*progress,4,2,ink,null);
  dot(844,245,3); text('Saved locally. Pick up where you left off.',855,249,11,400,muted);
  [400,788].forEach(x=>{line(x-6,141,x+2,149,'#b7b7b0',1.5);line(x+2,149,x-6,157,'#b7b7b0',1.5);});
}

function support(t) {
  setup(960,230);
  box(1,1,958,228,12,paper,border);
  text('A SMALL THANK YOU',35,51,10,600,muted);
  text('Keep the next update brewing.',35,106,32,700);
  text('If Traqu helps your day, you can buy me a coffee.',35,143,15,400,'#5f5e5b');
  text('A LITTLE COFFEE. A LITTLE MOMENTUM.',35,196,10,600,muted);
  c.save(); c.translate(759,121);
  // A simple ceramic cup, with a quiet loop of rising steam.
  c.beginPath(); c.moveTo(53,-23); c.bezierCurveTo(99,-34,103,38,53,30);
  c.strokeStyle=ink; c.lineWidth=3; c.stroke();
  c.beginPath(); c.moveTo(-52,-25); c.lineTo(53,-25); c.lineTo(47,38);
  c.quadraticCurveTo(42,57,0,57); c.quadraticCurveTo(-42,57,-47,38); c.closePath();
  c.fillStyle='#fff'; c.fill(); c.strokeStyle=ink; c.lineWidth=2.5; c.stroke();
  c.beginPath(); c.ellipse(0,-25,52,9,0,0,Math.PI*2); c.fillStyle='#ebe8e1'; c.fill(); c.stroke();
  line(-69,67,69,67,'#c7c7c0',2);
  dot(0,19,4,green);
  for(let i=0;i<3;i++) {
    const phase=(t/5+i/3)%1;
    c.save(); c.globalAlpha=.2+Math.sin(phase*Math.PI)*.3;
    const x=-25+i*24, y=-43-phase*12;
    c.beginPath(); c.moveTo(x,y); c.bezierCurveTo(x-13,y-12,x+13,y-21,x,y-33);
    c.strokeStyle=muted; c.lineWidth=1.8; c.stroke(); c.restore();
  }
  c.restore();
}

window.renderReadme = (kind,t) => {
  ({hero,flow,support})[kind](t);
  return canvas.toDataURL('image/png').split(',')[1];
};
hero(3.4);
</script>
</html>
